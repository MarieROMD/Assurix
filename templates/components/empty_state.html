{% comment %}
  État vide. Paramètres : icon, title, text, action_label (optionnel, ouvre la fenêtre « indisponible »)
{% endcomment %}
<div class="ax-empty">
  <span class="ax-empty__icon"><i class="bi {{ icon|default:'bi-inbox' }}" aria-hidden="true"></i></span>
  <h3 class="ax-empty__title">{{ title }}</h3>
  {% if text %}<p class="ax-empty__text">{{ text }}</p>{% endif %}
  {% if action_label %}
  <button type="button" class="ax-btn ax-btn--primary ax-btn--sm" data-bs-toggle="modal" data-bs-target="#axUnavailableModal"
          data-ax-unavailable="{{ action_label }}" data-ax-unavailable-detail="{{ action_detail }}">
    <i class="bi bi-plus-lg" aria-hidden="true"></i>{{ action_label }}
  </button>
  {% endif %}
</div>
